name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch: # manual test build: binary is uploaded as a workflow artifact

permissions:
  contents: write

jobs:
  build:
    # older Ubuntu = older glibc = binary runs on more distros
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Check tag matches pyproject version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          v=$(sed -n 's/^version = "\(.*\)"/\1/p' pyproject.toml)
          if [ "v$v" != "$GITHUB_REF_NAME" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match pyproject version $v"
            exit 1
          fi

      - name: Test and build
        run: make dist

      - name: Stable asset name for /releases/latest/download
        run: cp adguard-tray-*-linux-x86_64.tar.gz adguard-tray-linux-x86_64.tar.gz

      - uses: actions/upload-artifact@v4
        with:
          name: adguard-tray-linux-x86_64
          path: |
            adguard-tray-*.tar.gz
            adguard-tray-*.sha256

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes \
            adguard-tray-*.tar.gz adguard-tray-*.sha256
